<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle} + ' | Daily Tempo'">캘린더 | Daily Tempo</title>
    <link rel="stylesheet" href="../static/assets/css/reset.css" th:href="@{/assets/css/reset.css}">
    <link rel="stylesheet" href="../static/assets/css/common.css" th:href="@{/assets/css/common.css}">
    <style>
        body {
            height: 100dvh;
            overflow: hidden;
            background: #fff;
        }

        .mobile_calendar {
            display: flex;
            flex-direction: column;
            height: calc(100dvh - 84px);
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 8px 10px;
            box-sizing: border-box;
        }

        .calendar_toolbar {
            display: grid;
            grid-template-columns: 34px 1fr 34px;
            align-items: center;
            gap: 4px;
            height: 46px;
            flex: 0 0 46px;
        }

        .calendar_toolbar h1 {
            color: #222;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .icon_button {
            display: inline-flex;
            align-items: baseline;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #333;
            font-size: 25px;
            cursor: pointer;
        }

        .icon_button svg {
            width: 21px;
            height: 21px;
        }

        #openSettings {
            color: #fb6058;
        }

        .weekdays,
        .calendar_grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .weekdays {
            flex: 0 0 26px;
            align-items: center;
            color: #777;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #e8e8e8;
        }

        .weekdays span:first-child {
            color: #ef625b;
        }

        .calendar_grid {
            flex: 1;
            min-height: 0;
            grid-template-rows: repeat(6, minmax(0, 1fr));
            border-left: 1px solid #ececec;
            border-top: 1px solid #ececec;
        }

        .calendar_day {
            min-width: 0;
            min-height: 0;
            padding: 3px;
            overflow: hidden;
            border-right: 1px solid #ececec;
            border-bottom: 1px solid #ececec;
            background: #fff;
        }

        .calendar_day.other_month {
            background: #fafafa;
            color: #c8c8c8;
        }

        .calendar_day.today {
            background: #fff5f4;
            box-shadow: inset 0 0 0 1px #fe5f59;
        }

        .calendar_date {
            display: block;
            height: 17px;
            color: inherit;
            font-size: 10px;
            font-weight: 700;
            line-height: 17px;
        }

        .day_icons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-content: start;
            gap: 1px;
        }

        .exercise_icon {
            --icon-color: #fe5f59;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            aspect-ratio: 1;
            max-height: 25px;
            padding: 2px;
            border: 0;
            background: transparent;
            color: #aaa;
            cursor: pointer;
        }

        .exercise_icon.completed {
            color: var(--icon-color);
        }

        .exercise_icon svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        [data-icon="run"] { --icon-color: #ff6b5f; }
        [data-icon="upper"] { --icon-color: #6c63ff; }
        [data-icon="lower"] { --icon-color: #2ca58d; }
        [data-icon="dumbbell"] { --icon-color: #f2a900; }
        [data-icon="yoga"] { --icon-color: #d65db1; }
        [data-icon="cycle"] { --icon-color: #168aad; }
        [data-icon="swim"] { --icon-color: #277da1; }
        [data-icon="stretch"] { --icon-color: #7a9e3a; }

        .settings_modal[hidden] {
            display: none;
        }

        .settings_modal {
            position: fixed;
            z-index: 1000;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, .42);
        }

        .settings_sheet {
            width: min(100%, 600px);
            max-height: 78dvh;
            overflow-y: auto;
            padding: 20px 18px 30px;
            border-radius: 22px 22px 0 0;
            background: #fff;
            box-sizing: border-box;
        }

        .settings_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .settings_header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .settings_hint {
            margin-bottom: 16px;
            color: #777;
            font-size: 13px;
        }

        .icon_catalog {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .catalog_button {
            width: 100%;
            padding: 10px 4px 8px;
            border: 1px solid #e6e6e6;
            border-radius: 14px;
            background: #fff;
            color: #555;
            cursor: pointer;
        }

        .catalog_button svg {
            display: block;
            width: 34px;
            height: 34px;
            margin: 0 auto 5px;
            fill: none;
            stroke: var(--icon-color);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .catalog_button span {
            font-size: 11px;
        }

        .active_icons_title {
            margin: 24px 0 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .active_icon {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .active_icon_name {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .active_icon_name svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--icon-color);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .delete_button {
            padding: 6px 10px;
            border: 0;
            border-radius: 8px;
            background: #f2f2f2;
            color: #777;
        }

        @media (min-width: 601px) {
            .mobile_calendar {
                height: calc(100dvh - 100px);
            }

            .exercise_icon {
                max-height: 34px;
            }
        }
    </style>
</head>
<body>
<!-- 한 번 정의한 SVG 아이콘을 달력과 설정 화면에서 재사용합니다. -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="exercise-run" viewBox="0 0 24 24">
        <path d="M5 18c3-1 4-4 5-7l3 2 2-3"></path><path d="M9 7l3 1 2-3"></path>
        <path d="M10 11l-3 3-4 1M13 13l3 4 4 1"></path><circle cx="15" cy="3.5" r="1.5"></circle>
    </symbol>
    <symbol id="exercise-upper" viewBox="0 0 24 24">
        <circle cx="12" cy="4" r="2"></circle><path d="M8 21l1-8-3-3 3-3h6l3 3-3 3 1 8"></path>
        <path d="M6 10l-3 4M18 10l3 4M9 14h6"></path>
    </symbol>
    <symbol id="exercise-lower" viewBox="0 0 24 24">
        <path d="M8 3h8l-1 8-1 10h-4L9 11 8 3Z"></path><path d="M9 11h6M10 21H7M14 21h3"></path>
    </symbol>
    <symbol id="exercise-dumbbell" viewBox="0 0 24 24">
        <path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"></path>
    </symbol>
    <symbol id="exercise-yoga" viewBox="0 0 24 24">
        <circle cx="12" cy="4" r="2"></circle><path d="M12 7v6M7 9l5 3 5-3"></path>
        <path d="M12 13l-4 5h8l-4-5ZM5 20h14"></path>
    </symbol>
    <symbol id="exercise-cycle" viewBox="0 0 24 24">
        <circle cx="6" cy="17" r="4"></circle><circle cx="18" cy="17" r="4"></circle>
        <path d="M6 17l4-8 3 8h5l-4-6H9M13 7h3"></path>
    </symbol>
    <symbol id="exercise-swim" viewBox="0 0 24 24">
        <circle cx="16" cy="6" r="2"></circle><path d="M4 12l5-3 4 3 4-2 3 2"></path>
        <path d="M3 16c2-2 4 2 6 0s4 2 6 0 4 2 6 0M3 20c2-2 4 2 6 0s4 2 6 0 4 2 6 0"></path>
    </symbol>
    <symbol id="exercise-stretch" viewBox="0 0 24 24">
        <circle cx="12" cy="4" r="2"></circle><path d="M12 7v6M12 9L6 6M12 9l6-3"></path>
        <path d="M12 13l-5 7M12 13l5 7"></path>
    </symbol>
</svg>

<header>
    <div class="wrap">
        <div class="menu">
            <a href="home.html" th:href="@{/home}" aria-label="홈으로 이동">
                <img src="../static/assets/images/i_menu.png" th:src="@{/assets/images/i_menu.png}" alt="">
            </a>
        </div>
        <div class="logo">
            <a href="home.html" th:href="@{/home}">
                <img src="../static/assets/images/logo.png" th:src="@{/assets/images/logo.png}" alt="Daily Tempo">
            </a>
        </div>
        <div class="menu">
            <button class="icon_button" id="openSettings" type="button" aria-label="운동 아이콘 설정">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </div>
    </div>
</header>

<main class="mobile_calendar">
    <div class="calendar_toolbar">
        <a class="icon_button" href="calender.html" th:href="@{/calendar(month=${previousMonth})}" aria-label="이전 달">‹</a>
        <h1 th:text="${selectedMonth.year + '.' + selectedMonth.monthValue}">2026.7</h1>
        <a class="icon_button" href="calender.html" th:href="@{/calendar(month=${nextMonth})}" aria-label="다음 달">›</a>
    </div>

    <div class="weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span>
        <span>목</span><span>금</span><span>토</span>
    </div>

    <div class="calendar_grid">
        <section class="calendar_day"
                 th:each="day : ${calendarDays}"
                 th:classappend="${(!day.currentMonth ? 'other_month ' : '') + (day.today ? 'today' : '')}">
            <time class="calendar_date" th:datetime="${day.date}" th:text="${day.dayOfMonth}">1</time>
            <div class="day_icons" th:if="${day.currentMonth}">
                <button class="exercise_icon"
                        th:each="item : ${todoItems}"
                        th:classappend="${day.completedTodoIds.contains(item.id) ? 'completed' : ''}"
                        th:attr="data-item-id=${item.id},data-date=${day.date},data-icon=${item.iconKey},
                                 aria-label=${item.name + ' 완료 체크'},
                                 aria-pressed=${day.completedTodoIds.contains(item.id)}"
                        type="button">
                    <svg aria-hidden="true">
                        <use th:href="${'#exercise-' + item.iconKey}"></use>
                    </svg>
                </button>
            </div>
        </section>
    </div>
</main>

<div class="settings_modal" id="settingsModal" hidden>
    <section class="settings_sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings_header">
            <h2 id="settingsTitle">운동 아이콘 설정</h2>
            <button class="icon_button" id="closeSettings" type="button" aria-label="닫기">×</button>
        </div>
        <p class="settings_hint">캘린더에 표시할 운동을 눌러 추가하세요.</p>

        <div class="icon_catalog">
            <form th:each="option : ${iconOptions}" th:action="@{/calendar/todos}" method="post">
                <input type="hidden" name="month" th:value="${selectedMonth}">
                <input type="hidden" name="iconKey" th:value="${option.key}">
                <button class="catalog_button" th:attr="data-icon=${option.key}" type="submit">
                    <svg aria-hidden="true"><use th:href="${'#exercise-' + option.key}"></use></svg>
                    <span th:text="${option.label}">운동</span>
                </button>
            </form>
        </div>

        <h3 class="active_icons_title">캘린더에 표시 중</h3>
        <p class="settings_hint" th:if="${todoItems.isEmpty()}">추가한 운동 아이콘이 없습니다.</p>
        <div class="active_icon" th:each="item : ${todoItems}">
            <div class="active_icon_name" th:attr="data-icon=${item.iconKey}">
                <svg aria-hidden="true"><use th:href="${'#exercise-' + item.iconKey}"></use></svg>
                <span th:text="${item.name}">운동</span>
            </div>
            <form th:action="@{/calendar/todos/delete}" method="post">
                <input type="hidden" name="month" th:value="${selectedMonth}">
                <input type="hidden" name="itemId" th:value="${item.id}">
                <button class="delete_button" type="submit">삭제</button>
            </form>
        </div>
    </section>
</div>

<script>
    (function () {
        const modal = document.getElementById('settingsModal');
        const csrfMeta = document.querySelector('meta[name="_csrf"]');
        const csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
        const csrfToken = csrfMeta && csrfMeta.content;
        const csrfHeader = csrfHeaderMeta && csrfHeaderMeta.content;
        const staticMode = window.location.pathname.endsWith('.html');

        function openSettings() {
            modal.hidden = false;
        }

        document.getElementById('openSettings').addEventListener('click', openSettings);
        document.getElementById('closeSettings').addEventListener('click', function () {
            modal.hidden = true;
        });
        modal.addEventListener('click', function (event) {
            if (event.target === modal) modal.hidden = true;
        });

        function bindCompletionButtons() {
            document.querySelectorAll('.exercise_icon').forEach(function (button) {
                if (button.dataset.bound === 'true') return;
                button.dataset.bound = 'true';
                button.addEventListener('click', updateCompletion);
            });
        }

        async function updateCompletion() {
            const button = this;
            const completed = !button.classList.contains('completed');
            button.classList.toggle('completed', completed);
            button.setAttribute('aria-pressed', String(completed));

            const body = new URLSearchParams({
                itemId: button.dataset.itemId,
                date: button.dataset.date,
                completed: String(completed)
            });

            try {
                const response = await fetch('/calendar/completion', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                        [csrfHeader]: csrfToken
                    },
                    body: body
                });
                if (!response.ok) throw new Error('저장 실패');
            } catch (error) {
                button.classList.toggle('completed', !completed);
                button.setAttribute('aria-pressed', String(!completed));
                window.alert('운동 체크를 저장하지 못했습니다. 다시 시도해 주세요.');
            }
        }

        if (!staticMode) {
            bindCompletionButtons();
            return;
        }

        const ICON_OPTIONS = [
            {key: 'run', label: '달리기'},
            {key: 'upper', label: '상체 운동'},
            {key: 'lower', label: '하체 운동'},
            {key: 'dumbbell', label: '웨이트'},
            {key: 'yoga', label: '요가'},
            {key: 'cycle', label: '자전거'},
            {key: 'swim', label: '수영'},
            {key: 'stretch', label: '스트레칭'}
        ];
        const STORAGE_KEY = 'dailyTempoCalendar';
        let selectedMonth = new Date();
        let staticData = loadStaticData();

        function loadStaticData() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return {
                    icons: Array.isArray(saved && saved.icons) ? saved.icons : [],
                    completed: saved && typeof saved.completed === 'object' && saved.completed
                        ? saved.completed : {}
                };
            } catch (error) {
                return {icons: [], completed: {}};
            }
        }

        function saveStaticData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(staticData));
        }

        function dateKey(date) {
            return date.getFullYear() + '-' +
                String(date.getMonth() + 1).padStart(2, '0') + '-' +
                String(date.getDate()).padStart(2, '0');
        }

        function iconSvg(key) {
            return '<svg aria-hidden="true"><use href="#exercise-' + key + '"></use></svg>';
        }

        function renderCalendar() {
            const grid = document.querySelector('.calendar_grid');
            const title = document.querySelector('.calendar_toolbar h1');
            const year = selectedMonth.getFullYear();
            const month = selectedMonth.getMonth();
            const today = new Date();
            const start = new Date(year, month, 1 - new Date(year, month, 1).getDay());
            title.textContent = year + '.' + (month + 1);
            grid.innerHTML = '';

            for (let index = 0; index < 42; index++) {
                const date = new Date(start);
                date.setDate(start.getDate() + index);
                const currentMonth = date.getMonth() === month;
                const key = dateKey(date);
                const day = document.createElement('section');
                day.className = 'calendar_day' + (!currentMonth ? ' other_month' : '') +
                    (date.toDateString() === today.toDateString() ? ' today' : '');
                day.innerHTML = '<time class="calendar_date" datetime="' + key + '">' +
                    date.getDate() + '</time>';

                if (currentMonth) {
                    const icons = document.createElement('div');
                    icons.className = 'day_icons';
                    staticData.icons.forEach(function (iconKey) {
                        const option = ICON_OPTIONS.find(function (item) { return item.key === iconKey; });
                        if (!option) return;
                        const completed = (staticData.completed[key] || []).includes(iconKey);
                        const button = document.createElement('button');
                        button.className = 'exercise_icon' + (completed ? ' completed' : '');
                        button.type = 'button';
                        button.dataset.itemId = iconKey;
                        button.dataset.date = key;
                        button.dataset.icon = iconKey;
                        button.setAttribute('aria-label', option.label + ' 완료 체크');
                        button.setAttribute('aria-pressed', String(completed));
                        button.innerHTML = iconSvg(iconKey);
                        button.addEventListener('click', updateStaticCompletion);
                        icons.appendChild(button);
                    });
                    day.appendChild(icons);
                }
                grid.appendChild(day);
            }
        }

        function updateStaticCompletion() {
            const date = this.dataset.date;
            const iconKey = this.dataset.icon;
            const completedIcons = staticData.completed[date] || [];
            const index = completedIcons.indexOf(iconKey);
            if (index >= 0) {
                completedIcons.splice(index, 1);
            } else {
                completedIcons.push(iconKey);
            }
            if (completedIcons.length) staticData.completed[date] = completedIcons;
            else delete staticData.completed[date];
            saveStaticData();
            this.classList.toggle('completed', index < 0);
            this.setAttribute('aria-pressed', String(index < 0));
        }

        function renderSettings() {
            const catalog = document.querySelector('.icon_catalog');
            catalog.innerHTML = '';
            ICON_OPTIONS.forEach(function (option) {
                const button = document.createElement('button');
                button.className = 'catalog_button';
                button.type = 'button';
                button.dataset.icon = option.key;
                button.disabled = staticData.icons.includes(option.key);
                button.innerHTML = iconSvg(option.key) + '<span>' + option.label + '</span>';
                button.addEventListener('click', function () {
                    if (!staticData.icons.includes(option.key)) staticData.icons.push(option.key);
                    saveStaticData();
                    renderCalendar();
                    renderSettings();
                });
                catalog.appendChild(button);
            });

            modal.querySelectorAll('.active_icon, .active_icons_title + .settings_hint').forEach(function (element) {
                element.remove();
            });
            const title = modal.querySelector('.active_icons_title');
            if (!staticData.icons.length) {
                const empty = document.createElement('p');
                empty.className = 'settings_hint';
                empty.textContent = '추가한 운동 아이콘이 없습니다.';
                title.insertAdjacentElement('afterend', empty);
                return;
            }
            staticData.icons.slice().reverse().forEach(function (iconKey) {
                const option = ICON_OPTIONS.find(function (item) { return item.key === iconKey; });
                if (!option) return;
                const row = document.createElement('div');
                row.className = 'active_icon';
                row.innerHTML = '<div class="active_icon_name" data-icon="' + iconKey + '">' +
                    iconSvg(iconKey) + '<span>' + option.label + '</span></div>' +
                    '<button class="delete_button" type="button">삭제</button>';
                row.querySelector('.delete_button').addEventListener('click', function () {
                    staticData.icons = staticData.icons.filter(function (item) { return item !== iconKey; });
                    Object.keys(staticData.completed).forEach(function (date) {
                        staticData.completed[date] = staticData.completed[date].filter(function (item) {
                            return item !== iconKey;
                        });
                        if (!staticData.completed[date].length) delete staticData.completed[date];
                    });
                    saveStaticData();
                    renderCalendar();
                    renderSettings();
                });
                title.insertAdjacentElement('afterend', row);
            });
        }

        const monthLinks = document.querySelectorAll('.calendar_toolbar .icon_button');
        monthLinks[0].addEventListener('click', function (event) {
            event.preventDefault();
            selectedMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() - 1, 1);
            renderCalendar();
        });
        monthLinks[1].addEventListener('click', function (event) {
            event.preventDefault();
            selectedMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + 1, 1);
            renderCalendar();
        });
        document.getElementById('openSettings').addEventListener('click', renderSettings);
        renderCalendar();
    }());
</script>
</body>
</html>
