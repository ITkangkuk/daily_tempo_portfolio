<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Daily Tempo'">Daily Tempo</title>
    <meta name="keyword" content="">
    <meta name="description" content="">
    <meta name="author" content="">   
    
    <!-- css -->
    <link rel="stylesheet" th:href="@{/assets/css/reset.css}">
    <link rel="stylesheet" th:href="@{/assets/css/common.css}">
    <link rel="stylesheet" th:href="@{/assets/css/sub.css}">

    <!-- script -->
    <script th:src="@{/assets/scripts/jquery-3.1.1.min.js}"></script>
    <script th:src="@{/assets/scripts/script.js}"></script>
    
</head>
<body>
    <header>
        <div class="wrap">
            <div class="menu">
                <a href="">
                    <img th:src="@{/assets/images/i_menu.png}" alt="">
                </a>
            </div>
            <div class="menu">
                <a href="#none" style="visibility: hidden;">
                    <img th:src="@{/assets/images/i_menu.png}" alt="">
                </a>
            </div>
        </div>
    </header>
    <div class="content ">
        <div class="wrap">
            <form class="membership" th:action="@{/membership}" th:object="${form}" method="post">
                <div class="head_tit">
                    <h5>회원가입</h5>
                </div>
                <p th:if="${registrationError}" th:text="${registrationError}" role="alert"></p>
                <ul th:if="${#fields.hasAnyErrors()}" role="alert">
                    <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
                </ul>
                <div class="input_wrap">
                    <h5>아이디</h5>
                    <div class="flex">
                        <input type="text" th:field="*{username}" placeholder="아이디"
                               minlength="4" maxlength="20" pattern="[a-zA-Z0-9_]+"
                               autocomplete="username" required>
                    </div>
                </div>
                <div class="input_wrap">
                    <h5>비밀번호</h5>
                    <input type="password" th:field="*{password}" placeholder="영문과 숫자를 포함한 8자 이상"
                           minlength="8" maxlength="64"
                           pattern="(?=.*[A-Za-z])(?=.*\d).+"
                           autocomplete="new-password" required>
                </div>
                <div class="input_wrap">
                    <h5>비밀번호 확인</h5>
                    <input type="password" th:field="*{passwordConfirm}" placeholder="비밀번호 확인"
                           minlength="8" maxlength="64"
                           autocomplete="new-password" required>
                </div>
                <div class="input_wrap">
                    <h5>이름</h5>
                    <input type="text" th:field="*{name}" placeholder="실명을 입력하세요"
                           minlength="2" maxlength="30" pattern="[가-힣a-zA-Z\s]+"
                           autocomplete="name" required>
                </div>
                <div class="input_wrap">
                    <h5>휴대폰 번호</h5>
                    <div class="flex">
                        <input type="tel" th:field="*{phone}" placeholder='"-" 구분없이 입력'
                               inputmode="numeric" pattern="01[016789][0-9]{7,8}"
                               maxlength="11" autocomplete="tel">
                    </div>
                </div>
                <div class="input_wrap">
                    <h5>생년월일</h5>
                    <input type="text" th:field="*{birthDate}" placeholder="2000.00.00"
                           inputmode="numeric" pattern="[0-9]{4}\.[0-9]{2}\.[0-9]{2}"
                           maxlength="12" autocomplete="bday">
                </div>
                <div class="btn_sm">
                    <button type="submit" class="btn_primary">가입하기</button>
                </div>

            </form>
        </div>
    </div>
    <footer>

    </footer>


    
</body>
</html>
